name: Build luci-app-npc (x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'luci-app-npc/**'
      - 'nps/**'
      - '.github/workflows/build-luci-app-npc.yml'

env:
  SDK_VERSION: 21.02.7                          # 兼容 GoBinPackage 的稳定版本
  TARGET: x86/64
  SDK_URL: https://downloads.openwrt.org/releases/21.02.7/targets/x86/64/openwrt-sdk-21.02.7-x86-64_gcc-11.2.0_musl.Linux-x86_64.tar.xz
  SDK_DIR: openwrt-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev zlib1g-dev gawk git gettext libssl-dev xsltproc wget unzip python3

      - name: Cache OpenWrt SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ env.SDK_DIR }}
          key: openwrt-sdk-${{ env.SDK_VERSION }}-x86-64-v6   # 新缓存键，避免旧错误缓存

      - name: Download and extract SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          wget -q -O sdk.tar.xz "$SDK_URL"
          mkdir -p "$SDK_DIR"
          tar -xf sdk.tar.xz -C "$SDK_DIR" --strip-components=1
          rm sdk.tar.xz

      - name: Copy package sources
        run: |
          mkdir -p $SDK_DIR/package/luci-app-npc
          mkdir -p $SDK_DIR/package/nps
          cp -r luci-app-npc/* $SDK_DIR/package/luci-app-npc/
          cp -r nps/* $SDK_DIR/package/nps/

      - name: Update feeds and install dependencies
        working-directory: ${{ env.SDK_DIR }}
        run: |
          ./scripts/feeds update packages luci
          ./scripts/feeds install -a -p packages
          ./scripts/feeds install -a -p luci
          # golang 和 upx 是 nps 的编译依赖
          ./scripts/feeds install golang upx
          make defconfig

      - name: Enable required packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          echo "CONFIG_PACKAGE_npc=y" >> .config
          echo "CONFIG_PACKAGE_luci-app-npc=y" >> .config
          make defconfig

      - name: Build packages
        working-directory: ${{ env.SDK_DIR }}
        run: |
          make package/npc/compile V=s -j$(nproc)
          make package/luci-app-npc/compile V=s -j$(nproc)

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          find $SDK_DIR/bin/packages/${{ env.TARGET }}/ -name "*.ipk" -exec cp {} artifacts/ \;

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-npc-x86_64
          path: artifacts/
